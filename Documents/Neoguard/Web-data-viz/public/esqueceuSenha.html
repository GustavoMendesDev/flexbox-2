    var vtsenha = ["@", "#", "$", "%"];

    var emailVar = iptEmail.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    mensagem_erro.innerHTML = "";

    if (emailVar == "" || senhaVar == "") {
      console.log('Mensagem de erro para todos os campos em branco');
      mensagem_erro.innerHTML += "Preencha todos os campos!";
      return false;
    }

    if (!emailVar.includes("@") || emailVar.length < 5) {
      console.log('Mensagem de erro ');
      mensagem_erro.innerHTML += "Coloque um email válido!";
      return false;
    }
    let contemEspecial = false;
    for (let char of vtsenha) {
      if (senhaVar.includes(char)) {
        contemEspecial = true;
        break;
      }
    }

    if (!contemEspecial) {
      console.log('Mensagem de erro ');
      mensagem_erro.innerHTML += "A senha deve conter pelo menos um caractere especial (@, #, $, ou %)!";
      return false;
    }else {
            // Leva por enquanto para a página de Login
            window.location.href = '/app/views/Login.html';
        }
    }
</script>
